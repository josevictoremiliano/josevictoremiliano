name: Atualizar cards do README

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render_cards.py", "fonts/**"]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install fonttools brotli

      - name: Buscar dados do GitHub
        env:
          # Use um PAT em CARDS_TOKEN para incluir contribuições privadas; senão cai no token padrão
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py

      - name: Desenhar cards (hero, tiles, stack, atividade, projetos)
        run: python scripts/render_cards.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || git commit -m "chore: atualiza cards do README"
          git push
